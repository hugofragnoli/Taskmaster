programs:
  ping1:
    cmd: "ping google.com"
    num_processes: 2
    autostart: true
    restart_policy: "UnexpectedExits"
    expected_error_codes:
      - 0
      - 2
    minimum_runtime: 5
    max_relauch_retry: 4
    stop_signal: SIGABRT
    redirect:
      stdout: "ping1_stdout.txt"
      stderr: "ping1_stderr.txt"
    env_to_set:
      chien: "chat"
    umask: 022
  cwd:
    cmd: "./testprogs/cwd/main"
    num_processes: 1
    autostart: true
    restart_policy: "UnexpectedExits"
    expected_error_codes:
      - 0
      - 3
    minimum_runtime: 5
    max_relauch_retry: 4
    redirect:
      stdout: "cwd_stdout.txt"
      stderr: "cwd_stderr.txt"
    env_to_set:
      chien: "chat"
    working_dir: "/tmp"
    umask: 022
